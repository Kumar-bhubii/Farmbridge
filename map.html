<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply & Demand Map - FarmBridge</title>
  <meta name="description" content="See approximate pickup areas of crop lots and buyer requirements on an OpenStreetMap map.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="extras.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="dash-body" data-role="any">

  <header class="topbar">
    <a href="index.html" class="logo">🌾 Farm<span>Bridge</span></a>
    <div class="topbar-right">
      <div class="user-chip">
        <span class="avatar" data-avatar>🌾</span>
        <div><b data-user="name">User</b><small data-user="area"></small></div>
      </div>
      <button id="logout" class="btn-small" type="button" data-i18n="logout">Log out</button>
    </div>
  </header>

  <main class="dash-main">
    <a href="farmer.html" class="back-link" data-back data-i18n="back">← Back to dashboard</a>
    <section class="welcome">
      <p class="eyebrow dark">LOCATION INSIGHTS</p>
      <h1><span data-i18n="map_title">Supply &amp; demand map</span> <span class="script-inline">nearby</span></h1>
      <p class="section-sub" data-i18n="map_sub">Approximate pickup areas of open crop lots and buyer requirements.</p>
    </section>

    <div class="form filter-bar">
      <label>Crop <select id="m-crop"><option value="">All crops</option></select></label>
      <label>Show
        <select id="m-show"><option value="all">Lots + requirements</option><option value="lots">Only crop lots</option><option value="demands">Only requirements</option></select>
      </label>
    </div>

    <div class="map-legend">
      <span><i class="pin-farm"></i>Farmer crop lot</span>
      <span><i class="pin-buy"></i>Buyer requirement</span>
      <span>📍 Pins show the town centre only — exact addresses are never shown.</span>
    </div>
    <div id="fb-map"></div>
    <div id="map-summary" class="result-summary" style="margin-top:14px"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="data.js"></script>
  <script src="matching.js"></script>
  <script src="map.js"></script>
  <script src="translations.js"></script>
  <script src="extras.js"></script>
  <script src="voice.js"></script>
</body>
</html>
