<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Moderation - FarmBridge</title>
  <meta name="description" content="Moderate FarmBridge listings, buyer requirements, users and reports.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="extras.css">
</head>
<body class="dash-body" data-no-fab>
  <header class="topbar">
    <a href="index.html" class="logo">🌾 Farm<span>Bridge</span></a>
    <div class="topbar-right">
      <div class="user-chip"><span class="avatar">🛡️</span><div><b>Moderator</b><small>Pilot admin</small></div></div>
      <button id="admin-lock" class="btn-small" type="button" hidden>Lock</button>
    </div>
  </header>

  <main class="dash-main">
    <section id="gate" class="fb-panel pin-gate">
      <div class="icon-bubble" style="margin:0 auto 10px">🛡️</div>
      <h3>Moderator access</h3>
      <p class="section-sub">Demo PIN: <b>2026</b></p>
      <form id="pin-form" class="form">
        <input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN" aria-label="PIN" required>
        <button class="btn btn-solid" type="submit" style="margin-top:12px;width:100%">Unlock</button>
      </form>
    </section>

    <div id="admin" hidden>
      <section class="welcome">
        <p class="eyebrow dark">TRUST &amp; SAFETY</p>
        <h1><span data-i18n="admin_title">Admin &amp; moderation</span> <span class="script-inline">desk</span></h1>
        <p class="section-sub" data-i18n="admin_sub">Review listings, requirements and user reports to keep the platform trustworthy.</p>
      </section>
      <div class="kpi-row">
        <div class="kpi"><strong id="a-users">0</strong><small data-i18n="users">Users</small></div>
        <div class="kpi"><strong id="a-lots">0</strong><small data-i18n="lots">Crop lots</small></div>
        <div class="kpi"><strong id="a-demands">0</strong><small data-i18n="demands">Buyer requirements</small></div>
        <div class="kpi"><strong id="a-reports">0</strong><small>Open reports</small></div>
      </div>
      <div class="admin-tabs" role="tablist">
        <button type="button" data-tab="reports" class="active">🚩 Reports</button>
        <button type="button" data-tab="lots">🌾 Crop lots</button>
        <button type="button" data-tab="demands">🛒 Requirements</button>
        <button type="button" data-tab="users">👥 Users</button>
      </div>
      <section class="fb-panel" id="admin-list"></section>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="extras.js"></script>
  <script src="admin.js"></script>
</body>
</html>
